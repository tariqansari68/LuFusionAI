name: LuLuFusionAI Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest
    
    env:
      # Directs the newer runner to handle legacy action versions securely
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10 Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    - name: Pre-Install Core Testing Tools
      run: |
        python -m pip install --upgrade pip
        pip install httpx>=0.25.0 pytest>=7.4.0 python-dotenv>=1.0.1

    - name: Install Framework Packages
      run: |
        # Installs torch and transformers, avoiding full cache compilation delays
        pip install --no-cache-dir torch>=2.2.0 transformers>=4.38.0 numpy>=1.26.0 accelerate>=0.27.0 anthropic>=0.21.0

    - name: Execute Pytest Suite
      run: |
        pytest test_agent.py -v
