name: LuLuFusionAI Automation Suite

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
    # 1. Uses native Node 24 compliant checkout
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    # 2. Uses native Node 24 compliant Python engine setup
    - name: Set up Python 3.10 Environment
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    # 3. Pull down lightweight CPU versions to prevent runner memory out of memory (OOM) errors
    - name: Install System and Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install httpx>=0.25.0 pytest>=7.4.0 python-dotenv>=1.0.1
        
        # Pull light CPU versions directly from torch index to bypass large GPU binary overhead
        pip install torch==2.2.0 transformers>=4.38.0 numpy>=1.26.0 accelerate>=0.27.0 anthropic>=0.21.0 --extra-index-url https://pytorch.org

    # 4. Fire the local test runner
    - name: Execute Pytest Suite
      run: |
        pytest test_agent.py -v
